<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <title>KLOKSIE — Checkout received</title>
  <link rel="stylesheet" href="styles.css">
  <style>.payment-result{min-height:100vh;display:grid;place-items:center;padding:110px 20px 48px}.payment-card{max-width:680px;width:100%;padding:48px;border:1px solid #333;background:#f5f5f2;color:#090909}.payment-card h1{font-size:clamp(42px,7vw,86px);line-height:.9;margin:10px 0 24px}.payment-card p{max-width:560px;line-height:1.6}.payment-card .eyebrow{color:#666}.reference{font-family:monospace;margin:24px 0;padding:16px;background:#e4e4df;word-break:break-all}.payment-card .button-dark{background:#090909;color:#fff;text-decoration:none}</style>
</head>
<body>
  <main class="payment-result"><section class="payment-card"><p class="eyebrow">KLOKSIE — CHECKOUT</p><h1>THANK YOU.</h1><p>We received your checkout return. Payment is confirmed only after PayMongo marks it as paid; KLOKSIE will process the order after that confirmation.</p><p class="reference"><strong>REFERENCE:</strong> <span id="reference">—</span></p><a class="button button-dark" href="/#shop">BACK TO SHOP</a></section></main>
  <script>const ref=new URLSearchParams(location.search).get("reference");document.getElementById("reference").textContent=ref||localStorage.getItem("kloksieLastOrderReference")||"—";localStorage.removeItem("kloksieCart");</script>
</body>
</html>
