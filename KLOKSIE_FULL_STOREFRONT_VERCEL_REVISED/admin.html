<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <title>KLOKSIE — Store Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="styles.css">
  <style>
    .admin-container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; border-bottom: 1px solid #333; padding-bottom: 20px; }
    .admin-header h1 { margin: 0; font-size: 1.5em; }
    .admin-logout { background: #050505; color: #fff; border: none; padding: 10px 20px; cursor: pointer; text-decoration: none; }
    .admin-logout:hover { opacity: 0.8; }
    .login-form { max-width: 400px; margin: 100px auto; padding: 40px; border: 1px solid #333; background: #f5f5f2; }
    .login-form h2 { margin-top: 0; }
    .login-form input { width: 100%; padding: 10px; margin: 10px 0 20px 0; border: 1px solid #ccc; font-size: 1em; box-sizing: border-box; }
    .login-form button { width: 100%; padding: 12px; background: #050505; color: #fff; border: none; cursor: pointer; font-size: 1em; }
    .login-form button:hover { opacity: 0.8; }
    .admin-tabs { display: flex; gap: 0; border-bottom: 1px solid #333; margin-bottom: 30px; }
    .admin-tabs button { padding: 15px 20px; background: none; border: none; cursor: pointer; border-bottom: 3px solid transparent; font-size: 1em; }
    .admin-tabs button.active { border-bottom-color: #050505; font-weight: bold; }
    .admin-section { display: none; }
    .admin-section.active { display: block; }
    .product-form { background: #f5f5f2; padding: 30px; border: 1px solid #ddd; margin-bottom: 30px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; font-size: 1em; font-family: inherit; box-sizing: border-box; }
    .form-group textarea { resize: vertical; min-height: 100px; }
    .form-buttons { display: flex; gap: 10px; }
    .form-buttons button { padding: 12px 20px; background: #050505; color: #fff; border: none; cursor: pointer; font-size: 1em; }
    .form-buttons button:hover { opacity: 0.8; }
    .form-buttons .cancel { background: #ccc; color: #050505; }
    .products-table { width: 100%; border-collapse: collapse; }
    .products-table th, .products-table td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
    .products-table th { background: #f5f5f2; font-weight: bold; }
    .products-table img { width: 50px; height: 50px; object-fit: cover; }
    .products-table .actions { display: flex; gap: 10px; }
    .products-table .actions button { padding: 6px 12px; background: #050505; color: #fff; border: none; cursor: pointer; font-size: 0.9em; }
    .products-table .actions button.delete { background: #d32f2f; }
    .products-table .actions button:hover { opacity: 0.8; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: #f5f5f2; padding: 20px; border: 1px solid #ddd; text-align: center; }
    .stat-card .stat-number { font-size: 2em; font-weight: bold; margin: 10px 0; }
    .stat-card .stat-label { font-size: 0.9em; color: #666; }
    .alert { padding: 15px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px; }
    .alert.success { background: #e8f5e9; border-color: #4caf50; color: #2e7d32; }
    .alert.error { background: #ffebee; border-color: #f44336; color: #c62828; }
    .alert.hidden { display: none; }
  </style>
</head>
<body>
  <div id="loginScreen" class="login-form">
    <h2>KLOKSIE Admin</h2>
    <form id="loginForm">
      <input type="password" id="password" placeholder="Admin password" required>
      <button type="submit">Login</button>
    </form>
    <p style="font-size: 0.9em; color: #666; margin-top: 15px; text-align: center;">Demo password: admin123</p>
  </div>

  <div id="adminScreen" style="display: none;">
    <div class="admin-container">
      <div class="admin-header">
        <h1>KLOKSIE — Admin Dashboard</h1>
        <div>
          <a href="/" style="margin-right: 15px; text-decoration: none; color: #050505;">← Back to Store</a>
          <button class="admin-logout" onclick="logout()">Logout</button>
        </div>
      </div>

      <div id="alert" class="alert hidden"></div>

      <div class="admin-tabs">
        <button class="active" onclick="switchTab('dashboard')">Dashboard</button>
        <button onclick="switchTab('products')">Products</button>
        <button onclick="switchTab('add-product')">Add Product</button>
      </div>

      <div id="dashboard" class="admin-section active">
        <h2>Dashboard</h2>
        <div class="stats">
          <div class="stat-card">
            <div class="stat-label">Total Products</div>
            <div class="stat-number" id="totalProducts">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Active Products</div>
            <div class="stat-number" id="activeProducts">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Out of Stock</div>
            <div class="stat-number" id="outOfStock">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Total Inventory</div>
            <div class="stat-number" id="totalStock">0</div>
          </div>
        </div>
      </div>

      <div id="products" class="admin-section">
        <h2>All Products</h2>
        <table class="products-table" id="productsList">
          <thead>
            <tr>
              <th>Image</th>
              <th>Name</th>
              <th>Price</th>
              <th>Stock</th>
              <th>Category</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="productsBody">
          </tbody>
        </table>
      </div>

      <div id="add-product" class="admin-section">
        <h2>Add New Product</h2>
        <div class="product-form">
          <form id="productForm">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
              <div class="form-group">
                <label>Product Name *</label>
                <input type="text" id="productName" required>
              </div>
              <div class="form-group">
                <label>Price (PHP) *</label>
                <input type="number" id="productPrice" step="100" min="0" required>
              </div>
              <div class="form-group">
                <label>Stock *</label>
                <input type="number" id="productStock" min="0" required>
              </div>
              <div class="form-group">
                <label>Category</label>
                <select id="productCategory">
                  <option>Streetwear</option>
                  <option>Y2K</option>
                  <option>Grunge/Archive</option>
                  <option>Accessories</option>
                </select>
              </div>
              <div class="form-group">
                <label>Size (optional)</label>
                <input type="text" id="productSize" placeholder="e.g., 37, One Size">
              </div>
              <div class="form-group">
                <label>Tag (optional)</label>
                <input type="text" id="productTag" placeholder="e.g., NEW, COMING SOON">
              </div>
            </div>
            <div class="form-group">
              <label>Description *</label>
              <textarea id="productDescription" required></textarea>
            </div>
            <div class="form-group">
              <label>Image URL *</label>
              <input type="url" id="productImage" required placeholder="https://...">
            </div>
            <div class="form-group">
              <label>Status</label>
              <select id="productActive">
                <option value="true">Active</option>
                <option value="false">Inactive</option>
              </select>
            </div>
            <div class="form-buttons">
              <button type="submit">Add Product</button>
              <button type="button" class="cancel" onclick="resetForm()">Clear</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    const ADMIN_PASSWORD = "admin123";
    let products = JSON.parse(localStorage.getItem("kloksieAdminProducts") || "[]");

    function login() {
      const password = document.getElementById("password").value;
      if (password === ADMIN_PASSWORD) {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("adminScreen").style.display = "block";
        loadDashboard();
        return true;
      }
      alert("Invalid password");
      return false;
    }

    function logout() {
      document.getElementById("loginScreen").style.display = "block";
      document.getElementById("adminScreen").style.display = "none";
      document.getElementById("password").value = "";
    }

    function switchTab(tab) {
      document.querySelectorAll(".admin-section").forEach(el => el.classList.remove("active"));
      document.querySelectorAll(".admin-tabs button").forEach(el => el.classList.remove("active"));
      document.getElementById(tab).classList.add("active");
      event.target.classList.add("active");
      if (tab === "products") loadProducts();
      if (tab === "dashboard") loadDashboard();
    }

    function loadDashboard() {
      const total = products.length;
      const active = products.filter(p => p.active !== false).length;
      const outStock = products.filter(p => p.stock < 1).length;
      const totalStock = products.reduce((sum, p) => sum + (p.stock || 0), 0);
      
      document.getElementById("totalProducts").textContent = total;
      document.getElementById("activeProducts").textContent = active;
      document.getElementById("outOfStock").textContent = outStock;
      document.getElementById("totalStock").textContent = totalStock;
    }

    function loadProducts() {
      const tbody = document.getElementById("productsBody");
      tbody.innerHTML = products.map((p, i) => `
        <tr>
          <td><img src="${p.image}" alt="${p.name}"></td>
          <td>${p.name}</td>
          <td>₱${p.price.toLocaleString()}</td>
          <td>${p.stock}</td>
          <td>${p.category || "—"}</td>
          <td>${p.active !== false ? "Active" : "Inactive"}</td>
          <td class="actions">
            <button onclick="editProduct(${i})">Edit</button>
            <button class="delete" onclick="deleteProduct(${i})">Delete</button>
          </td>
        </tr>
      `).join("");
    }

    function editProduct(index) {
      const p = products[index];
      document.getElementById("productName").value = p.name;
      document.getElementById("productPrice").value = p.price;
      document.getElementById("productStock").value = p.stock;
      document.getElementById("productCategory").value = p.category || "Streetwear";
      document.getElementById("productSize").value = p.size || "";
      document.getElementById("productTag").value = p.tag || "";
      document.getElementById("productDescription").value = p.description;
      document.getElementById("productImage").value = p.image;
      document.getElementById("productActive").value = p.active !== false ? "true" : "false";
      
      document.getElementById("productForm").onsubmit = function(e) {
        e.preventDefault();
        products[index] = {
          id: p.id,
          name: document.getElementById("productName").value,
          price: Number(document.getElementById("productPrice").value),
          stock: Number(document.getElementById("productStock").value),
          category: document.getElementById("productCategory").value,
          size: document.getElementById("productSize").value || undefined,
          tag: document.getElementById("productTag").value || undefined,
          description: document.getElementById("productDescription").value,
          image: document.getElementById("productImage").value,
          active: document.getElementById("productActive").value === "true",
          alt: p.alt || p.name
        };
        saveProducts();
        showAlert("Product updated successfully!", "success");
        resetForm();
        switchTab("products");
      };
      
      switchTab("add-product");
      document.querySelector(".admin-tabs button:nth-child(3)").textContent = "Edit Product";
    }

    function deleteProduct(index) {
      if (confirm("Delete this product?")) {
        products.splice(index, 1);
        saveProducts();
        loadProducts();
        showAlert("Product deleted!", "success");
      }
    }

    function saveProducts() {
      localStorage.setItem("kloksieAdminProducts", JSON.stringify(products));
      window.products = products;
      window.dispatchEvent(new Event("productsUpdated"));
    }

    function resetForm() {
      document.getElementById("productForm").reset();
      document.getElementById("productForm").onsubmit = addProduct;
      document.querySelector(".admin-tabs button:nth-child(3)").textContent = "Add Product";
    }

    function addProduct(e) {
      e.preventDefault();
      const newProduct = {
        id: "admin-" + Date.now(),
        name: document.getElementById("productName").value,
        price: Number(document.getElementById("productPrice").value),
        stock: Number(document.getElementById("productStock").value),
        category: document.getElementById("productCategory").value,
        size: document.getElementById("productSize").value || undefined,
        tag: document.getElementById("productTag").value || undefined,
        description: document.getElementById("productDescription").value,
        image: document.getElementById("productImage").value,
        active: document.getElementById("productActive").value === "true",
        alt: document.getElementById("productName").value
      };
      products.push(newProduct);
      saveProducts();
      showAlert("Product added successfully!", "success");
      resetForm();
      switchTab("dashboard");
    }

    function showAlert(message, type) {
      const alert = document.getElementById("alert");
      alert.textContent = message;
      alert.className = `alert ${type}`;
      setTimeout(() => alert.classList.add("hidden"), 3000);
    }

    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      login();
    });

    document.getElementById("productForm").addEventListener("submit", addProduct);

    // Sync with main site
    window.addEventListener("productsUpdated", () => {
      window.products = products;
    });
  </script>
</body>
</html>
