<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>KLOKSIE — Store Admin</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="admin.css"><style>.admin-shell{max-width:1200px;margin:0 auto;padding:100px 24px 60px}.admin-top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #333;padding-bottom:20px;margin-bottom:30px}.admin-top a{margin-right:18px}.login-panel{max-width:420px;margin:14vh auto;padding:38px;background:#f5f5f2;color:#080808}.login-panel h1{font-size:38px;margin:0 0 28px}.admin-form{background:#f5f5f2;color:#080808;padding:28px;border:1px solid #ddd}.admin-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.admin-field{margin-bottom:18px}.admin-field.full{grid-column:1/-1}.admin-field label{display:block;font-size:10px;letter-spacing:.13em;margin-bottom:8px;font-weight:700}.admin-field input,.admin-field textarea,.admin-field select{width:100%;padding:11px;border:1px solid #bbb;background:#fff;box-sizing:border-box;font:inherit}.price-box{border:1px solid #bbb;background:#fff;padding:14px}.price-box label{margin-bottom:7px}.price-box small{display:block;margin-top:6px;font-size:9px;opacity:.65}.admin-field textarea{min-height:100px}.admin-actions{display:flex;gap:10px;flex-wrap:wrap}.admin-actions button{padding:12px 18px;border:0;background:#050505;color:#fff;cursor:pointer;letter-spacing:.08em}.admin-actions .secondary{background:#ddd;color:#050505}.upload-zone{border:1px dashed #aaa;padding:18px;background:#fff}.upload-zone input{border:0;padding:0}.image-preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:14px}.image-preview{position:relative;border:1px solid #bbb;background:#eee;aspect-ratio:1;cursor:pointer}.image-preview img{width:100%;height:100%;object-fit:cover}.image-preview.featured{outline:3px solid #050505}.image-preview .remove-image{position:absolute;right:4px;top:4px;background:#050505;color:#fff;border:0;width:25px;height:25px;cursor:pointer}.image-preview .featured-label{position:absolute;left:4px;bottom:4px;background:#fff;color:#050505;font-size:8px;padding:4px;letter-spacing:.08em}.variant-row{display:grid;grid-template-columns:1fr 1fr 110px 40px;gap:8px;margin-bottom:8px}.variant-row input{padding:9px;border:1px solid #bbb}.variant-row button{border:1px solid #bbb;background:#fff;cursor:pointer}.inventory{margin-top:35px}.inventory-row{display:grid;grid-template-columns:80px 1fr auto;gap:18px;align-items:center;border-bottom:1px solid #333;padding:15px 0}.inventory-row img{width:80px;height:80px;object-fit:cover;background:#eee}.row-actions{display:flex;gap:8px}.row-actions button{padding:8px 12px;border:1px solid #777;background:transparent;cursor:pointer}.message{min-height:20px;margin:14px 0;font-size:12px}.message.success{color:#287a39}.logout{background:#050505;color:#fff;border:0;padding:10px 15px;cursor:pointer}.orders{margin-top:60px}.orders-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:15px}.order-row{border:1px solid #333;margin-bottom:12px;background:#f5f5f2;color:#080808}.order-summary{display:grid;grid-template-columns:1.2fr 1fr .8fr .8fr auto;gap:15px;align-items:center;padding:16px}.order-summary h3{margin:0 0 5px;font-size:15px}.order-summary p{margin:0;font-size:11px}.order-status{font-size:10px;letter-spacing:.1em;font-weight:700}.order-details{border-top:1px solid #ccc;padding:16px;display:none}.order-row.open .order-details{display:block}.order-details-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.order-items{margin-top:15px;border-top:1px solid #ccc;padding-top:12px}.order-item{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #ddd;font-size:12px}.order-status-select{padding:8px;border:1px solid #999;background:#fff}.order-view{padding:8px 12px;border:1px solid #777;background:#fff;cursor:pointer}.orders-empty{padding:20px 0}.order-reference{font-family:monospace;font-size:12px}@media(max-width:700px){.admin-form-grid{grid-template-columns:1fr}.admin-field.full{grid-column:auto}.variant-row{grid-template-columns:1fr 1fr 80px 35px}.inventory-row{grid-template-columns:60px 1fr}.inventory-row .row-actions{grid-column:2}.admin-shell{padding:90px 16px 40px}.admin-top{align-items:flex-start;gap:15px}.order-summary{grid-template-columns:1fr 1fr}.order-summary .order-view{grid-column:2}.order-details-grid{grid-template-columns:1fr}}</style></head><body><div id="loginPanel" class="login-panel"><h1>KLOKSIE ADMIN</h1><form id="loginForm"><label style="font-size:10px;letter-spacing:.12em">ADMIN PASSWORD<input name="password" type="password" required style="display:block;width:100%;margin:8px 0 18px;padding:12px;box-sizing:border-box"></label><button class="button button-dark" type="submit">LOGIN</button></form><p id="loginMessage" class="message"></p></div><div id="dashboard" class="admin-shell" hidden><header class="admin-top"><div><p class="eyebrow">KLOKSIE</p><h1 style="font-size:42px;margin:0">STORE ADMIN</h1></div><div><a href="/">← STORE</a><button class="logout" id="signOut">LOG OUT</button></div></header><p id="dashboardMessage" class="message"></p><form id="productForm" class="admin-form"><h2 id="formTitle" style="font-size:38px;margin:0 0 25px">Add a product</h2><input type="hidden" name="id"><div class="admin-form-grid"><div class="admin-field"><label>PRODUCT NAME *</label><input name="name" required></div><div class="admin-field"><label>CATEGORY</label><select name="category"><option value="Shoes">SHOES</option><option value="Shirts">SHIRTS</option><option value="Accessories">ACCESSORIES</option><option value="Pants">PANTS</option><option value="Shorts">SHORTS</option><option value="Long Sleeve">LONG SLEEVE</option><option value="Jackets">JACKETS</option></select></div><div class="admin-field price-box"><label>PH PRICE (₱) *</label><input name="price" type="number" min="0" step="1" required><small>Price charged/displayed for Philippines.</small></div><div class="admin-field price-box"><label>INTERNATIONAL PRICE ($ USD) *</label><input name="international_price_usd" type="number" min="0" step="0.01" placeholder="e.g. 85.00" required><small>Set your own higher international retail price.</small></div><div class="admin-field"><label>BASE STOCK *</label><input name="stock" type="number" min="0" required></div><div class="admin-field"><label>TAG</label><input name="tag" placeholder="NEW, SOLD OUT, etc."></div><div class="admin-field"><label>DEFAULT SIZE / LEGACY SIZE</label><input name="size" placeholder="Optional"></div><div class="admin-field full"><label>DESCRIPTION *</label><textarea name="description" required></textarea></div><div class="admin-field full"><label>PRODUCT IMAGES — FIRST IMAGE IS FEATURED BY DEFAULT</label><div class="upload-zone"><input id="imageFiles" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple><div id="imagePreview" class="image-preview-grid"></div></div></div><div class="admin-field full"><label>COLOR / SIZE VARIATIONS</label><div id="variantsList"></div><button type="button" class="admin-actions secondary" id="addVariant" style="padding:9px 12px">+ ADD VARIATION</button></div><div class="admin-field"><label>ACTIVE</label><select name="active"><option value="true">Visible</option><option value="false">Hidden</option></select></div><div class="admin-field"><label>SORT ORDER</label><input name="sort_order" type="number" value="0"></div></div><div class="admin-actions"><button class="save-product" type="submit">SAVE PRODUCT</button><button type="button" class="secondary" id="resetForm">CLEAR</button></div></form><section class="inventory"><div style="display:flex;justify-content:space-between;align-items:end"><div><p class="eyebrow">INVENTORY</p><h2 style="font-size:38px;margin:0">Products</h2></div><span id="inventoryCount"></span></div><div id="productList"></div></section><section class="orders"><div class="orders-head"><div><p class="eyebrow">ORDERS</p><h2 style="font-size:38px;margin:0">Customer orders</h2></div><button class="order-view" id="refreshOrders">REFRESH</button></div><p id="ordersMessage" class="message"></p><div id="ordersList"></div></section></div><script src="admin.js"></script></body></html>
